<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #location {
            margin-top: 20px;
            font-size: 1.2em;
            background-color: #e0f7fa; /* Light blue color */
        }
    </style>
</head>
<body>
    <h1>User Geolocation</h1>
    <button onclick="getLocation()">Get Location</button>
    <div id="location"></div>

    <script>
        function getLocation() {
            const locationElement = document.getElementById('location');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                locationElement.textContent = "Geolocation is not supported by this browser.";
            }
        }

        function showPosition(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            document.getElementById('location').textContent = `Latitude: ${latitude}, Longitude: ${longitude}`;
        }

        function showError(error) {
            const locationElement = document.getElementById('location');
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    locationElement.textContent = "User denied the request for Geolocation.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    locationElement.textContent = "Location information is unavailable.";
                    break;
                case error.TIMEOUT:
                    locationElement.textContent = "The request to get user location timed out.";
                    break;
                case error.UNKNOWN_ERROR:
                    locationElement.textContent = "An unknown error occurred.";
                    break;
            }
        }
    </script>
</body>
</html>
