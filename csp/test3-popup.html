<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test 3: Popup Window</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 { color: #333; font-size: 24px; }
        #results {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .result-item {
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            font-size: 14px;
        }
        .pending { background: #fff3cd; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        .info { background: #d1ecf1; }
    </style>
</head>
<body>
    <h1>Popup Window - Test 3</h1>
    <p>This popup will check window.opener before and after attempting to load a blocked tracker.</p>
    
    <div id="results">
        <div class="result-item pending">Running tests...</div>
    </div>

    <script>
        const results = [];
        const reportData = {
            openerAccessible: false,
            openerLocation: null,
            openerError: null,
            trackerBlocked: false,
            trackerError: null,
            trackerStatus: null,
            openerCheckTiming: null
        };
        
        async function runTests() {
            const resultsDiv = document.getElementById('results');
            
            // Step 1: Check window.opener BEFORE tracker load
            results.push({ type: 'info', text: 'Step 1: Checking window.opener before tracker load...' });
            
            let openerBeforeTracker = checkOpener('before tracker load');
            
            // Step 2: Attempt to load blocked tracker
            results.push({ type: 'info', text: 'Step 2: Attempting to load blocked tracker (segment.io)...' });
            renderResults();
            
            try {
                const response = await fetch('https://api.segment.io/v1/t', {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ test: true, popup: true, timestamp: Date.now() })
                });
                
                reportData.trackerBlocked = false;
                reportData.trackerStatus = response.status;
                results.push({ type: 'error', text: `Tracker loaded! Status: ${response.status}` });
                
            } catch (error) {
                reportData.trackerBlocked = true;
                reportData.trackerError = error.message;
                results.push({ type: 'success', text: `Tracker blocked: ${error.name}` });
            }
            
            // Step 3: Check window.opener AFTER tracker load attempt
            results.push({ type: 'info', text: 'Step 3: Checking window.opener after tracker load...' });
            
            let openerAfterTracker = checkOpener('after tracker load');
            
            // Step 4: Compare results
            results.push({ type: 'info', text: '--- Summary ---' });
            
            if (openerBeforeTracker === openerAfterTracker) {
                results.push({ 
                    type: 'success', 
                    text: `window.opener status unchanged: ${openerBeforeTracker ? 'accessible' : 'not accessible'}` 
                });
            } else {
                results.push({ 
                    type: 'error', 
                    text: `window.opener status CHANGED! Before: ${openerBeforeTracker}, After: ${openerAfterTracker}` 
                });
            }
            
            reportData.openerCheckTiming = 'before and after tracker load attempt';
            
            renderResults();
            
            // Send results to parent window if possible
            if (window.opener && typeof window.opener.postMessage === 'function') {
                try {
                    window.opener.postMessage({ type: 'popup-results', ...reportData }, '*');
                    results.push({ type: 'info', text: 'Results sent to parent window.' });
                } catch (e) {
                    results.push({ type: 'info', text: `Could not send results to parent: ${e.message}` });
                }
                renderResults();
            }
        }
        
        function checkOpener(timing) {
            try {
                if (window.opener === null) {
                    results.push({ type: 'info', text: `window.opener is null (${timing})` });
                    return false;
                }
                if (window.opener === undefined) {
                    results.push({ type: 'info', text: `window.opener is undefined (${timing})` });
                    return false;
                }
                
                // Try to access opener's location
                const openerLocation = window.opener.location.href;
                results.push({ type: 'success', text: `window.opener accessible (${timing})` });
                results.push({ type: 'info', text: `Opener URL: ${openerLocation}` });
                
                reportData.openerAccessible = true;
                reportData.openerLocation = openerLocation;
                return true;
                
            } catch (error) {
                // Cross-origin access might throw
                results.push({ type: 'info', text: `window.opener access error (${timing}): ${error.message}` });
                reportData.openerError = error.message;
                
                // opener exists but we can't access its location (cross-origin)
                if (window.opener !== null && window.opener !== undefined) {
                    reportData.openerAccessible = true;
                    reportData.openerLocation = '(cross-origin, not accessible)';
                    return true;
                }
                return false;
            }
        }
        
        function renderResults() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = results.map(r => 
                `<div class="result-item ${r.type}">${r.text}</div>`
            ).join('');
        }
        
        // Run tests after page load
        window.addEventListener('load', () => {
            setTimeout(runTests, 100);
        });
    </script>
</body>
</html>
