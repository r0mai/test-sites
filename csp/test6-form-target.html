<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form POST Target Window</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 { color: #333; font-size: 24px; }
        #results {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .result-item {
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            font-size: 14px;
        }
        .pending { background: #fff3cd; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        .info { background: #d1ecf1; }
        .code-block {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>Form POST Target Window</h1>
    <p>This page was opened via form POST with <code>target="_blank"</code>.</p>
    
    <div id="results">
        <div class="result-item pending">Checking window.opener and POST data...</div>
    </div>

    <script>
        const results = [];
        const reportData = {
            type: 'form-target-results',
            openerAccessible: false,
            openerLocation: null,
            openerError: null,
            postData: null,
            referrer: document.referrer || null,
            formAction: window.location.href
        };
        
        // Check window.opener
        try {
            if (window.opener === null) {
                results.push({ type: 'error', text: 'window.opener is null' });
                reportData.openerError = 'null';
            } else if (window.opener === undefined) {
                results.push({ type: 'error', text: 'window.opener is undefined' });
                reportData.openerError = 'undefined';
            } else {
                // Try to access opener's location
                try {
                    const openerLocation = window.opener.location.href;
                    results.push({ type: 'success', text: 'window.opener is accessible' });
                    results.push({ type: 'info', text: `Opener URL: ${openerLocation}` });
                    reportData.openerAccessible = true;
                    reportData.openerLocation = openerLocation;
                } catch (e) {
                    // Cross-origin - opener exists but can't access location
                    results.push({ type: 'info', text: 'window.opener exists but location is cross-origin protected' });
                    reportData.openerAccessible = true;
                    reportData.openerLocation = '(cross-origin, not readable)';
                    reportData.openerError = e.message;
                }
            }
        } catch (e) {
            results.push({ type: 'error', text: `Error checking window.opener: ${e.message}` });
            reportData.openerError = e.message;
        }
        
        // Check referrer
        if (document.referrer) {
            results.push({ type: 'info', text: `document.referrer: ${document.referrer}` });
        } else {
            results.push({ type: 'info', text: 'document.referrer is empty' });
        }
        
        // Note about POST data
        results.push({ type: 'info', text: 'Note: POST data is not accessible via JavaScript on the client side.' });
        results.push({ type: 'info', text: 'Check Network tab in DevTools to see if POST data was sent.' });
        
        // Check URL parameters (in case form was converted to GET)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.toString()) {
            results.push({ type: 'info', text: `URL params (if GET): ${urlParams.toString()}` });
        }
        
        // Render results
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = results.map(r => 
            `<div class="result-item ${r.type}">${r.text}</div>`
        ).join('');
        
        // Add raw data display
        resultsDiv.innerHTML += `
            <h4 style="margin-top: 20px;">Raw Report Data:</h4>
            <div class="code-block">${JSON.stringify(reportData, null, 2)}</div>
        `;
        
        // Send results to parent window if possible
        if (window.opener && typeof window.opener.postMessage === 'function') {
            try {
                window.opener.postMessage(reportData, '*');
                results.push({ type: 'success', text: 'Results sent to parent window.' });
            } catch (e) {
                results.push({ type: 'info', text: `Could not send results to parent: ${e.message}` });
            }
        }
    </script>
</body>
</html>
