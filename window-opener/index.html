<!DOCTYPE html>
<html>
<head><title>Opener Test</title></head>
<body>
    <h1>window.opener Test</h1>
    <button onclick="openPopup()">Open Popup</button>
    <pre id="log"></pre>

    <script>
        function log(msg) {
            document.getElementById('log').textContent += msg + '\n';
        }

        function openPopup() {
            var features = 'width=500,height=400,top=100,left=100';
            var popup = window.open('popup.html', 'test_popup', features);
            log('Popup opened: ' + (popup ? 'yes' : 'blocked'));
        }

        window.addEventListener('message', function(e) {
            log('Message from popup: ' + JSON.stringify(e.data));
        });

        window.onAuthComplete = function(data) {
            log('onAuthComplete called: ' + JSON.stringify(data));
        };
    </script>
</body>
</html>
